[[module]]
id = "maintenance"
name = "Maintenance dedicated line"
workflow = "maintenance_intake"
summary = "Intake on a dedicated channel boundary, store the request and photo metadata, classify emergency versus routine with a phrase list, and queue a human when judgment is needed."
human_gates = ["outbound_contact", "spend", "emergency_decision", "irreversible_action"]
intended = [
  "Own a tenant maintenance channel",
  "Store the request and any photo metadata",
  "Separate emergency from routine",
  "Queue Shear or the property manager when a person is needed",
  "Help schedule routine work after a person approves the message",
]
not_implemented = [
  "Provisioning a dedicated phone number",
  "A live BlueBubbles or other messaging client",
  "Vendor dispatch",
  "Automatic notification of Shear, tenants, or a property manager",
]
blockers = [
  "The maintenance line number strategy is undecided",
  "BlueBubbles is not verified on Shear's M1",
  "No standing rule from Shear allows unattended contact",
]
docs = []
notes = [
  "This is the only runnable workflow in the starter.",
  "Emergency matches queue a local draft. They do not send it and they do not dispatch anyone.",
  "Phrase triage misses paraphrases. Those land in needs_review for a person.",
]


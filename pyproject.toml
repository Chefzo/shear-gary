[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shear-gary"
version = "0.1.0"
description = "Local-first Gary starter for maintenance intake at Galleria Workspace."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gary = "gary.cli:main"

[tool.setuptools.packages.find]
include = ["gary*"]
